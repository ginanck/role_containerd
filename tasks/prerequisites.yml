---

- name: ensure containerd binaries are in PATH
  ansible.builtin.template:
    src: containerd.sh.j2
    dest: /etc/profile.d/containerd.sh
    owner: root
    group: root
    mode: '0644'

- name: ensure /etc/sysctl.d exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: create sysctl configuration file for containerd
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "/etc/sysctl.d/{{ containerd_sysctl_conf_file }}"
    owner: root
    group: root
    mode: '0644'
  register: sysctl_config

- name: apply sysctl parameters
  ansible.builtin.command: "sysctl -p /etc/sysctl.d/{{ containerd_sysctl_conf_file }}"
  when: sysctl_config.changed
