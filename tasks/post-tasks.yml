---

- name: create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: get latest crictl release version without token
  ansible.builtin.uri:
    url: https://api.github.com/repos/kubernetes-sigs/cri-tools/releases/latest
    method: GET
    status_code: 200
    return_content: yes
  register: crictl_latest_no_token
  when: github_access_token is not defined

- name: get latest crictl release version with token
  ansible.builtin.uri:
    url: https://api.github.com/repos/kubernetes-sigs/cri-tools/releases/latest
    method: GET
    headers:
      Authorization: "Bearer {{ github_access_token }}"
      Accept: "application/vnd.github.v3+json"
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 200
    return_content: yes
  register: crictl_latest_with_token
  when: github_access_token is defined

- name: set crictl_latest from appropriate source
  ansible.builtin.set_fact:
    crictl_latest: "{{ crictl_latest_with_token if (crictl_latest_with_token is defined and crictl_latest_with_token.skipped is not defined) else crictl_latest_no_token }}"
  changed_when: false

- name: set crictl version from release data
  ansible.builtin.set_fact:
    crictl_version: "{{ crictl_latest.json.tag_name | default('') | regex_replace('^v', '') }}"
  changed_when: false
  when:
    - crictl_latest is defined
    - crictl_latest.skipped is not defined
    - crictl_version is not defined or (crictl_version is defined and crictl_version | length == 0)

- name: setup crictl binary for repo installation type
  ansible.builtin.include_tasks: "{{ containerd_setup_type }}/crictl.yml"
  when: containerd_setup_type == "repo"

- name: create containerd configuration file
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ containerd_config_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  register: containerd_config_toml_result

- name: create crictl configuration file
  ansible.builtin.template:
    src: crictl.yaml.j2
    dest: "{{ containerd_crictl_config_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  register: crictl_conf_result

- name: install containerd systemd service
  ansible.builtin.template:
    src: containerd.service.j2
    dest: "{{ containerd_systemd_service_file }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  register: containerd_service_result

- name: restart containerd service
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: yes
    daemon_reload: yes
  when: >
    (crictl_conf_result is defined and crictl_conf_result.changed) or
    (containerd_service_result is defined and containerd_service_result.changed) or
    (containerd_config_toml_result is defined and containerd_config_toml_result.changed)
