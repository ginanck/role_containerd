---

- name: download cni plugins archive with checksum verification
  ansible.builtin.get_url:
    url: "{{ cni_plugins_binary.url }}"
    dest: "{{ containerd_binary_staging_path }}/cni-{{ containerd_cni_plugins_version }}/{{ cni_plugins_binary.filename }}"
    checksum: "{{ containerd_checksum_algorithm }}:{{ containerd_cni_plugins_checksum_resolved }}"
    mode: '0644'

- name: create cni directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ containerd_cni_bin_dir }}"
    - "{{ containerd_cni_conf_dir }}"

- name: extract cni plugins
  ansible.builtin.unarchive:
    src: "{{ containerd_binary_staging_path }}/cni-{{ containerd_cni_plugins_version }}/{{ cni_plugins_binary.filename }}"
    dest: "{{ containerd_cni_bin_dir }}"
    remote_src: true
    creates: "{{ containerd_cni_bin_dir }}/bridge"
