---

- name: Download CNI plugins binary file
  ansible.builtin.get_url:
    url: "{{ cni_plugins_binary.url }}"
    dest: "/opt/packages/{{ cni_plugins_binary.filename }}"
    mode: '0644'

- name: Download CNI plugins verification file
  ansible.builtin.get_url:
    url: "{{ cni_plugins_verification.url }}"
    dest: "/opt/packages/{{ cni_plugins_verification.filename }}"
    mode: '0644'

- name: Create CNI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "/opt/cni/bin"
    - "/etc/cni/net.d"

- name: Extract CNI plugins
  ansible.builtin.unarchive:
    src: "/opt/packages/{{ cni_plugins_binary.filename }}"
    dest: "/opt/cni/bin"
    remote_src: yes
