---
# Resolve the expected sha256 for every artifact before anything is
# installed. Order of precedence:
#   1. explicit per-artifact variable (containerd_binary_checksum, ...)
#   2. per-architecture map (containerd_binary_checksums[arch], ...)
#   3. the checksum file published next to the release asset
# Every get_url in the setup tasks then fails before installing when the
# downloaded bytes do not match.

- name: resolve containerd checksum from an explicit pin
  ansible.builtin.set_fact:
    containerd_binary_checksum_resolved: "{{ containerd_binary_checksum | regex_replace('^sha256:', '') }}"
  when: containerd_binary_checksum | length > 0

- name: resolve containerd checksum from the per-architecture map
  ansible.builtin.set_fact:
    containerd_binary_checksum_resolved: >-
      {{ containerd_binary_checksums[containerd_architecture] | default('') | regex_replace('^sha256:', '') }}
  when: containerd_binary_checksum | length == 0

- name: fetch the published containerd checksum file
  ansible.builtin.get_url:
    url: "{{ containerd_verification.url }}"
    dest: "{{ containerd_binary_staging_path }}/{{ version_suffix }}/{{ containerd_verification.filename }}"
    mode: '0644'
  vars:
    version_suffix: "containerd-{{ containerd_version }}"
  when: containerd_binary_checksum_resolved | length == 0

- name: read the published containerd checksum
  ansible.builtin.slurp:
    src: "{{ containerd_binary_staging_path }}/containerd-{{ containerd_version }}/{{ containerd_verification.filename }}"
  register: containerd_checksum_file
  when: containerd_binary_checksum_resolved | length == 0

- name: set containerd checksum from the published file
  ansible.builtin.set_fact:
    containerd_binary_checksum_resolved: "{{ (containerd_checksum_file.content | b64decode).split()[0] }}"
  when: containerd_binary_checksum_resolved | length == 0

- name: resolve runc checksum from an explicit pin
  ansible.builtin.set_fact:
    containerd_runc_checksum_resolved: "{{ containerd_runc_checksum | regex_replace('^sha256:', '') }}"
  when: containerd_runc_checksum | length > 0

- name: resolve runc checksum from the per-architecture map
  ansible.builtin.set_fact:
    containerd_runc_checksum_resolved: >-
      {{ containerd_runc_checksums[containerd_architecture] | default('') | regex_replace('^sha256:', '') }}
  when: containerd_runc_checksum | length == 0

- name: fetch the published runc checksum file
  ansible.builtin.get_url:
    url: "{{ runc_verification.url }}"
    dest: "{{ containerd_binary_staging_path }}/runc-{{ containerd_runc_version }}/{{ runc_verification.filename }}"
    mode: '0644'
  when: containerd_runc_checksum_resolved | length == 0

- name: read the published runc checksum
  ansible.builtin.slurp:
    src: "{{ containerd_binary_staging_path }}/runc-{{ containerd_runc_version }}/{{ runc_verification.filename }}"
  register: runc_checksum_file
  when: containerd_runc_checksum_resolved | length == 0

- name: set runc checksum from the published file
  ansible.builtin.set_fact:
    containerd_runc_checksum_resolved: >-
      {{ (runc_checksum_file.content | b64decode).splitlines()
         | select('match', '^[0-9a-f]{64}\\s+runc\\.' ~ containerd_architecture ~ '$')
         | map('regex_replace', '\\s.*$', '')
         | list | first }}
  when: containerd_runc_checksum_resolved | length == 0

- name: resolve cni plugins checksum from an explicit pin
  ansible.builtin.set_fact:
    containerd_cni_plugins_checksum_resolved: "{{ containerd_cni_plugins_checksum | regex_replace('^sha256:', '') }}"
  when: containerd_cni_plugins_checksum | length > 0

- name: resolve cni plugins checksum from the per-architecture map
  ansible.builtin.set_fact:
    containerd_cni_plugins_checksum_resolved: >-
      {{ containerd_cni_plugins_checksums[containerd_architecture] | default('') | regex_replace('^sha256:', '') }}
  when: containerd_cni_plugins_checksum | length == 0

- name: fetch the published cni plugins checksum file
  ansible.builtin.get_url:
    url: "{{ cni_plugins_verification.url }}"
    dest: "{{ containerd_binary_staging_path }}/cni-{{ containerd_cni_plugins_version }}/{{ cni_plugins_verification.filename }}"
    mode: '0644'
  when: containerd_cni_plugins_checksum_resolved | length == 0

- name: read the published cni plugins checksum
  ansible.builtin.slurp:
    src: "{{ containerd_binary_staging_path }}/cni-{{ containerd_cni_plugins_version }}/{{ cni_plugins_verification.filename }}"
  register: cni_checksum_file
  when: containerd_cni_plugins_checksum_resolved | length == 0

- name: set cni plugins checksum from the published file
  ansible.builtin.set_fact:
    containerd_cni_plugins_checksum_resolved: "{{ (cni_checksum_file.content | b64decode).split()[0] }}"
  when: containerd_cni_plugins_checksum_resolved | length == 0
