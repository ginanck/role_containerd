---

- name: download containerd archive with checksum verification
  ansible.builtin.get_url:
    url: "{{ containerd_binary.url }}"
    dest: "{{ containerd_binary_staging_path }}/containerd-{{ containerd_version }}/{{ containerd_binary.filename }}"
    checksum: "{{ containerd_checksum_algorithm }}:{{ containerd_binary_checksum_resolved }}"
    mode: '0644'
  register: containerd_archive

- name: extract containerd archive
  ansible.builtin.unarchive:
    src: "{{ containerd_binary_staging_path }}/containerd-{{ containerd_version }}/{{ containerd_binary.filename }}"
    dest: "{{ containerd_binary_staging_path }}/containerd-{{ containerd_version }}/extracted/"
    remote_src: true
    creates: "{{ containerd_binary_staging_path }}/containerd-{{ containerd_version }}/extracted/bin/containerd"

- name: find extracted containerd binaries
  ansible.builtin.find:
    paths: "{{ containerd_binary_staging_path }}/containerd-{{ containerd_version }}/extracted/bin"
    file_type: file
  register: containerd_extracted_binaries

- name: install containerd binaries into the path the unit uses
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ containerd_binary_install_path }}/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  loop: "{{ containerd_extracted_binaries.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: restart containerd
