---

- name: download runc binary with checksum verification
  ansible.builtin.get_url:
    url: "{{ runc_binary.url }}"
    dest: "{{ containerd_binary_install_path }}/runc"
    checksum: "{{ containerd_checksum_algorithm }}:{{ containerd_runc_checksum_resolved }}"
    owner: root
    group: root
    mode: '0755'
  notify: restart containerd
