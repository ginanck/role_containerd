---

- name: set download URLs and filenames for each component
  ansible.builtin.set_fact:
    # Containerd binary and published checksum
    containerd_binary:
      url: >-
        {{ containerd_binary_url | default('https://github.com/containerd/containerd/releases/download/' ~ containerd_tag ~ '/containerd-' ~ containerd_version ~ '-linux-' ~ containerd_architecture ~ '.tar.gz') }}
      filename: "containerd-{{ containerd_version }}-linux-{{ containerd_architecture }}.tar.gz"
      type: "binary"
    containerd_verification:
      url: >-
        {{ containerd_binary_verification_url | default('https://github.com/containerd/containerd/releases/download/' ~ containerd_tag ~ '/containerd-' ~ containerd_version ~ '-linux-' ~ containerd_architecture ~ '.tar.gz.sha256sum') }}
      filename: "containerd-{{ containerd_version }}-linux-{{ containerd_architecture }}.tar.gz.sha256sum"
      type: "checksum"

    # Runc binary; the release publishes one checksum file for every arch
    runc_binary:
      url: "https://github.com/opencontainers/runc/releases/download/{{ runc_tag }}/runc.{{ containerd_architecture }}"
      filename: "runc.{{ containerd_architecture }}"
      type: "binary"
    runc_verification:
      url: "https://github.com/opencontainers/runc/releases/download/{{ runc_tag }}/runc.sha256sum"
      filename: "runc.sha256sum"
      type: "checksum"

    # CNI plugins bundle and published checksum
    cni_plugins_binary:
      url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_tag }}/cni-plugins-linux-{{ containerd_architecture }}-{{ cni_plugins_tag }}.tgz"
      filename: "cni-plugins-linux-{{ containerd_architecture }}-{{ cni_plugins_tag }}.tgz"
      type: "binary"
    cni_plugins_verification:
      url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_tag }}/cni-plugins-linux-{{ containerd_architecture }}-{{ cni_plugins_tag }}.tgz.sha256"
      filename: "cni-plugins-linux-{{ containerd_architecture }}-{{ cni_plugins_tag }}.tgz.sha256"
      type: "checksum"
